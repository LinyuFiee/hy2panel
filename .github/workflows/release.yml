name: Release

on:
  push:
    tags:
      - "v0.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.x.y tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Reuse CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  build-and-release:
    name: Build and publish v0 bundle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      BUNDLE: hy2panel-bundle-linux-amd64.tar.gz
    steps:
      - name: Reject invalid tag input
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ${RELEASE_TAG} =~ ^v0\.[0-9]+\.[0-9]+$ ]]

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a published tag at HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [[ ${tag_commit} == "$(git rev-parse HEAD)" ]]
          [[ $(git status --short --untracked-files=all) == "" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate tag and source versions
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./web/package.json').version")"
          LOCK_VERSION="$(node -p "require('./web/package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./web/package-lock.json').packages[''].version")"
          GO_VERSION="$(sed -nE 's/^[[:space:]]*var[[:space:]]+Version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' internal/version/version.go)"
          [[ -n ${PACKAGE_VERSION} && -n ${LOCK_VERSION} && -n ${LOCK_ROOT_VERSION} && -n ${GO_VERSION} ]]
          [[ ${TAG_VERSION} == "${PACKAGE_VERSION}" ]]
          [[ ${TAG_VERSION} == "${LOCK_VERSION}" ]]
          [[ ${TAG_VERSION} == "${LOCK_ROOT_VERSION}" ]]
          [[ ${TAG_VERSION} == "${GO_VERSION}" ]]
          printf 'release version %s\n' "${TAG_VERSION}"

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build tagged Linux amd64 binary
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X hy2panel/internal/version.Version=${RELEASE_TAG#v}" \
            -o dist/hy2panel-linux-amd64 ./cmd/hy2panel
          [[ $(./dist/hy2panel-linux-amd64 version) == "${RELEASE_TAG#v}" ]]

      - name: Package complete bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release/bundle/dist release/bundle/scripts/lib release/bundle/systemd release/bundle/packaging release/bundle/licenses
          install -m 0755 dist/hy2panel-linux-amd64 release/bundle/dist/hy2panel-linux-amd64
          install -m 0644 THIRD_PARTY_NOTICES.md release/bundle/licenses/THIRD_PARTY_NOTICES.md

          scripts=(
            scripts/hy2
            scripts/install.sh
            scripts/hy2panel-apply.sh
            scripts/hy2panel-backup.sh
            scripts/hy2panel-bbr.sh
            scripts/hy2panel-recover.sh
            scripts/hy2panel-restore.sh
            scripts/hy2panel-sing-box.sh
            scripts/hy2panel-uninstall.sh
            scripts/hy2panel-upgrade.sh
            scripts/hy2panel-watchdog.sh
            scripts/cert-deploy.sh
          )
          for script in "${scripts[@]}"; do
            install -m 0755 "${script}" "release/bundle/scripts/$(basename "${script}")"
          done
          install -m 0644 scripts/99-hy2panel.conf release/bundle/scripts/99-hy2panel.conf
          install -m 0644 scripts/lib/hy2panel-transaction.sh release/bundle/scripts/lib/hy2panel-transaction.sh
          install -m 0644 packaging/sing-box-versions.json release/bundle/packaging/sing-box-versions.json

          units=(
            systemd/hy2panel.service
            systemd/sing-box.service
            systemd/hy2panel-apply.path
            systemd/hy2panel-apply.service
            systemd/hy2panel-bbr.path
            systemd/hy2panel-bbr.service
            systemd/hy2panel-recover.service
            systemd/hy2panel-sing-box.path
            systemd/hy2panel-sing-box.service
            systemd/hy2panel-upgrade.path
            systemd/hy2panel-upgrade.service
            systemd/hy2panel-watchdog.service
            systemd/hy2panel-watchdog.timer
          )
          for unit in "${units[@]}"; do
            install -m 0644 "${unit}" "release/bundle/systemd/$(basename "${unit}")"
          done

          [[ ! -e release/bundle/systemd/hy2panel-firewall.service ]]
          tar --sort=name --mtime="UTC 1970-01-01" --owner=0 --group=0 --numeric-owner \
            -czf "release/${BUNDLE}" -C release/bundle .
          (
            cd release
            digest="$(sha256sum "${BUNDLE}" | cut -d' ' -f1)"
            printf '%s  %s\n' "${digest}" "${BUNDLE}" > "${BUNDLE}.sha256"
            sha256sum --check "${BUNDLE}.sha256"
          )

      - name: Validate published bundle contents
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(mktemp)"
          expected="$(mktemp)"
          trap 'rm -f "${actual}" "${expected}"' EXIT
          tar -tzf "release/${BUNDLE}" | sed -E 's#^\./##' | sed '/^$/d; /\/$/d' | sort > "${actual}"
          cat > "${expected}" <<'EOF'
          dist/hy2panel-linux-amd64
          licenses/THIRD_PARTY_NOTICES.md
          packaging/sing-box-versions.json
          scripts/99-hy2panel.conf
          scripts/cert-deploy.sh
          scripts/hy2
          scripts/hy2panel-apply.sh
          scripts/hy2panel-backup.sh
          scripts/hy2panel-bbr.sh
          scripts/hy2panel-recover.sh
          scripts/hy2panel-restore.sh
          scripts/hy2panel-sing-box.sh
          scripts/hy2panel-uninstall.sh
          scripts/hy2panel-upgrade.sh
          scripts/hy2panel-watchdog.sh
          scripts/install.sh
          scripts/lib/hy2panel-transaction.sh
          systemd/hy2panel-apply.path
          systemd/hy2panel-apply.service
          systemd/hy2panel-bbr.path
          systemd/hy2panel-bbr.service
          systemd/hy2panel-recover.service
          systemd/hy2panel-sing-box.path
          systemd/hy2panel-sing-box.service
          systemd/hy2panel-upgrade.path
          systemd/hy2panel-upgrade.service
          systemd/hy2panel-watchdog.service
          systemd/hy2panel-watchdog.timer
          systemd/hy2panel.service
          systemd/sing-box.service
          EOF
          sort -o "${expected}" "${expected}"
          diff -u "${expected}" "${actual}"
          ! grep -q 'firewall' "${actual}"

      - name: Copy standalone v0.4 migration helper
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0755 scripts/migrate-v04-to-v05.sh release/migrate-v04-to-v05.sh
          sed -i "s/^TARGET_VERSION=.*/TARGET_VERSION=${RELEASE_TAG}/" release/migrate-v04-to-v05.sh
          grep -q "^TARGET_VERSION=${RELEASE_TAG}$" release/migrate-v04-to-v05.sh
          bash -n release/migrate-v04-to-v05.sh
          source release/migrate-v04-to-v05.sh
          hy2panel_valid_migration_target "${TARGET_VERSION}"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/hy2panel-bundle-linux-amd64.tar.gz
            release/migrate-v04-to-v05.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "release/${BUNDLE}" \
              "release/${BUNDLE}.sha256" \
              "release/migrate-v04-to-v05.sh" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "release/${BUNDLE}" \
              "release/${BUNDLE}.sha256" \
              "release/migrate-v04-to-v05.sh" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
